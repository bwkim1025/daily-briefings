<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>지난 호 · 땡이네 뉴스</title>
  <script>
    const home=new URL('./',location.href);
    const date=location.hash.slice(1)||new URL(location.href).searchParams.get('date');
    if(/^\d{4}-\d{2}-\d{2}$/.test(date||''))home.searchParams.set('date',date);
    else home.hash='archive';
    location.replace(home.href);
  </script>
</head>
<body><a href="./#archive">지난 호 달력 열기</a></body>
</html>
